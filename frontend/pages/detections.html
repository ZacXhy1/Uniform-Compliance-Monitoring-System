<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detections · Uniform Compliance</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/detections.css" />
  <script src="../js/auth.js"></script>
  <script src="../js/settings.js"></script>
  <script src="../js/config.js"></script>
  <script>requireAuth();</script>
  <script src="../js/boot.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/header.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar"></div>
    <div class="app-main">
      <div id="header"></div>
      <script>renderSidebar('detections'); renderHeader('Detections');</script>
      <main class="app-content">

        <div class="review-banner" id="review-banner" hidden>
          <span id="review-banner-text"></span>
          <button type="button" class="btn btn-primary btn-sm" id="review-banner-btn">Review now</button>
        </div>

        <div class="detections-toolbar">
          <input
            type="text"
            id="detections-search"
            class="input"
            placeholder="Search by detection ID or student label…"
          />
          <select id="detections-status-filter" class="select">
            <option value="all">All Statuses</option>
            <option value="compliant">Compliant</option>
            <option value="violation">Violation</option>
            <option value="pending">Pending Review</option>
          </select>
          <select id="detections-sort" class="select">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>

        <p class="detections-count" id="detections-count"></p>

        <div class="card" id="detections-table-wrap">
          <table class="data-table detections-table">
            <colgroup>
              <col style="width: 22%" />
              <col style="width: 15%" />
              <col style="width: 23%" />
              <col style="width: 16%" />
              <col style="width: 12%" />
              <col style="width: 12%" />
            </colgroup>
            <thead>
              <tr>
                <th>ID</th>
                <th>Detected</th>
                <th class="col-center">Date &amp; Time</th>
                <th class="col-center">Status</th>
                <th class="col-center">Confidence</th>
                <th class="col-center"></th>
              </tr>
            </thead>
            <tbody id="detections-table-body"></tbody>
          </table>
          <nav class="pagination" id="detections-pagination" aria-label="Detections pages" hidden></nav>
        </div>

        <div class="card placeholder-block" id="detections-empty" hidden>
          No detections match your search or filters. Try adjusting them.
        </div>

      </main>
    </div>
  </div>

  <script src="../js/data/mock-data.js"></script>
  <script src="../js/components/stat-card.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/pagination.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/monitoring-engine.js"></script>
  <script src="../js/live-api.js"></script>
  <script src="../js/pages/detections.js"></script>
</body>
</html>
