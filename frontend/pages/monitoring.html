<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Monitoring · Uniform Compliance</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/monitoring.css?v=6" />
  <script src="../js/auth.js"></script>
  <script src="../js/settings.js"></script>
  <script src="../js/config.js"></script>
  <script>requireAuth();</script>
  <script src="../js/boot.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/header.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar"></div>
    <div class="app-main">
      <div id="header"></div>
      <script>renderSidebar('monitoring'); renderHeader('Live Monitoring');</script>
      <main class="app-content monitoring-fit">
        <div class="monitoring-layout">

          <!-- Main focus: the camera feed. On large screens it fills the whole
               left side (see the "fit" block in css/pages/monitoring.css). -->
          <section class="card monitoring-feed-card">
            <!-- #monitoring-feed is the element that goes full screen, so
                 everything that must stay visible in full screen (status chips,
                 controls, detection popups) lives INSIDE it. -->
            <div class="monitoring-feed" id="monitoring-feed">
              <video id="monitoring-video" class="monitoring-video" autoplay playsinline muted hidden></video>
              <!-- LIVE mode: annotated MJPEG stream from the backend (not mirrored, so text and labels read correctly). -->
              <img id="monitoring-live-feed" class="monitoring-video" style="transform:none" alt="Live camera feed" hidden />

              <div class="monitoring-feed-topleft">
                <span class="monitoring-feed-dot" id="monitoring-feed-dot"></span>
                <span id="monitoring-feed-status-text">IDLE</span>
              </div>

              <div class="monitoring-feed-topright">
                <span id="monitoring-feed-datetime"></span>
                <span id="monitoring-feed-camera-label" class="monitoring-feed-camera-label" hidden>
                  Main Gate Camera Feed
                </span>
              </div>

              <div class="monitoring-feed-placeholder" id="monitoring-feed-placeholder">
                <span class="monitoring-feed-icon">&#128247;</span>
                <span id="monitoring-feed-placeholder-text">Main Gate Camera Feed (simulated — no video)</span>
              </div>
              <div class="monitoring-scanline" aria-hidden="true"></div>

              <!-- Detection popups: only shown while in full screen and monitoring
                   is running (see showDetectionPopup() in js/pages/monitoring.js). -->
              <div class="monitoring-popups" id="monitoring-popups" aria-live="polite"></div>

              <!-- Corner "expand" button (page view). -->
              <button type="button" class="monitoring-fs-corner js-fullscreen-toggle"
                      aria-label="Enter full screen" title="Full screen (F)">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              </button>

              <!-- Control bar (full screen only; fades out when the mouse is idle). -->
              <div class="monitoring-fs-bar">
                <button type="button" class="btn btn-secondary js-check-uniform" hidden>Check uniform</button>
                <button type="button" class="btn btn-primary js-monitoring-toggle">Start Monitoring</button>
                <button type="button" class="btn btn-secondary js-fullscreen-toggle">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
                  Exit Full Screen
                </button>
              </div>
            </div>

            <div class="monitoring-controls">
              <div class="monitoring-status" id="monitoring-status">
                <span class="monitoring-status-dot" id="monitoring-status-dot"></span>
                <span id="monitoring-status-text">Idle</span>
              </div>
              <div class="monitoring-controls-actions">
                <button type="button" class="btn btn-secondary js-check-uniform" id="monitoring-check-btn" hidden>Check uniform</button>
                <button type="button" class="btn btn-secondary js-fullscreen-toggle" id="monitoring-fullscreen-btn">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                  Full Screen
                </button>
                <button type="button" class="btn btn-primary js-monitoring-toggle" id="monitoring-toggle">
                  Start Monitoring
                </button>
              </div>
            </div>
          </section>

          <!-- Everything else, stacked in a column beside the feed. (On small
               screens this wrapper dissolves — display: contents — and the cards
               go back to the original stacked layout.) -->
          <div class="monitoring-side">
            <section class="card monitoring-today-card">
              <div class="monitoring-today-stat">
                <span class="monitoring-today-value" id="today-status-value">Idle</span>
                <span class="monitoring-today-label">Current Status</span>
              </div>
              <div class="monitoring-today-stat">
                <span class="monitoring-today-value" id="today-total-value">0</span>
                <span class="monitoring-today-label">Today's Detections</span>
              </div>
              <div class="monitoring-today-stat">
                <span class="monitoring-today-value monitoring-today-value--compliant" id="today-compliant-value">0</span>
                <span class="monitoring-today-label">Compliant</span>
              </div>
              <div class="monitoring-today-stat">
                <span class="monitoring-today-value monitoring-today-value--violation" id="today-violation-value">0</span>
                <span class="monitoring-today-label">Non-Compliant</span>
              </div>
            </section>

            <section class="card monitoring-result-card">
              <h2>Latest Detection</h2>
              <div id="monitoring-result-content">
                <div class="placeholder-block">
                  No detections yet. Click "Start Monitoring" to simulate the
                  camera picking up students at the Main Gate.
                </div>
              </div>
            </section>

            <section class="card monitoring-recent-card">
              <h2>Recent Detections</h2>
              <div class="monitoring-recent-wrap">
                <ul class="monitoring-recent-list" id="monitoring-recent-list"></ul>
              </div>
            </section>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="../js/data/mock-data.js"></script>
  <script src="../js/components/stat-card.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/monitoring-engine.js"></script>
  <script src="../js/live-api.js"></script>
  <script src="../js/pages/monitoring.js?"></script>
</body>
</html>
